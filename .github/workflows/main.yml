name: CI

permissions:
  contents: read

env:
  CHECK_LABEL: training
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  parallel-demo:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup
      - name: Test
        id: tests
        background: true
        run: mise run test

      - name: Lint
        run: mise run lint

      - name: Wait for tests
        wait: tests
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup
      - run: mise run lint
  test:
    runs-on: ubuntu-26.04
    outputs:
      report-name: ${{ steps.report-meta.outputs.name }}
    steps:
      - name: Define report name
        id: report-meta
        run: echo 'name=test-report' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.10
      - run: mise run setup
      - run: mise run test
      - name: Save test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.report-meta.outputs.name }}
          path: reports/test-results.xml
          retention-days: 7
          if-no-files-found: error
  inspect-report:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.test.outputs.report-name }}
          path: received-report
      - name: Check downloaded report
        run: test -s received-report/test-results.xml


  verify:
    name: CI result
    needs: [lint, test]
    runs-on: ubuntu-26.04
    steps:
      - run: echo "All checks passed"
  server-demo:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.3.0
      - name: Start demo server
        id: server
        background: true
        run: mise run serve-demo
      - name: Wait for readiness
        run: curl --fail --retry 60 --retry-connrefused --retry-delay 1 --max-time 2 --retry-max-time 120 http://127.0.0.1:3000/
      - name: Check response
        run: test "$(curl --fail --silent http://127.0.0.1:3000/)" = ready
      - name: Stop demo server
        cancel: server
  variables:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.3.0
      - name: Show workflow values
        run: |
          printf '%s\n' "$CHECK_LABEL"
          printf '%s\n' "$GITHUB_WORKFLOW"
      - name: Show step value
        env:
          CHECK_LABEL: local-step
        run: printf '%s\n' "$CHECK_LABEL"
      - name: Manual run information
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo 'This step was requested manually'
      - name: Show CI label
        env:
          LABEL: ${{ vars.CI_LABEL || 'training' }}
        run: echo "$LABEL"
      - name: Test
        run: mise run test
      - name: Explain failure
        if: ${{ failure() }}
        run: echo 'A check failed. Open the first failed step and inspect its log.'
  secrets:
    runs-on: ubuntu-26.04
    steps:
      - name: Read repository information
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/$GITHUB_REPOSITORY" --jq .full_name
      - name: Show PR title
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE"
